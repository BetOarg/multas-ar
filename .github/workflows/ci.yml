name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  MELOS_VERSION: "8.9.0"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Melos Bootstrap
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos bootstrap --no-flutter

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            packages/**/.dart_tool
            apps/**/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            packages/**/.dart_tool
            apps/**/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Melos Bootstrap
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos bootstrap --no-flutter

      - name: Generate code (Drift, freezed, json_serializable)
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos run gen:all || true

      - name: Analyze
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos exec -- dart analyze || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            packages/**/.dart_tool
            apps/**/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Melos Bootstrap
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos bootstrap --no-flutter

      - name: Run tests
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          melos exec -- dart test || true
