name: multas_ar
description: Asistente Legal de Infracciones de Tránsito — República Argentina
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Estado ──────────────────────────────────────────
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Base de datos ────────────────────────────────────
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── OCR ─────────────────────────────────────────────
  onnxruntime: ^1.18.0
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.13.0

  # ── Cámara e imagen ──────────────────────────────────
  camera: ^0.11.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image_cropper: ^7.0.0

  # ── IA / API Anthropic ───────────────────────────────
  http: ^1.2.1
  dio: ^5.4.3

  # ── Seguridad ────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Notificaciones locales ───────────────────────────
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # ── UI ───────────────────────────────────────────────
  go_router: ^13.2.1
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

  # ── Utilidades ───────────────────────────────────────
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/normativa/
    - assets/fonts/
